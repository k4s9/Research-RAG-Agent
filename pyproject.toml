[project]
name = "research-rag-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "aiofiles>=23.2.1",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.110.0",
    "gradio>=4.26.0",
    "loguru>=0.7.2",
    "pydantic>=2.6.1",
    "pydantic-settings>=2.1.0",
    "pymilvus>=2.4.3",
    "pymupdf>=1.24.5",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "sqlalchemy>=2.0.29",
    "uvicorn>=0.28.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "ANN", "B", "A", "COM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: tests with no external service dependencies",
    "integration: tests requiring local backing services",
    "e2e: tests requiring the complete application stack",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "pre-commit",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
]
ocr = ["paddleocr>=2.7.0.3"]
legacy-models = ["flagembedding>=1.2.16"]
