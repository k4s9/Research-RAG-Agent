version: '3.8'

services:
  qwen3-embedding:
    image: quay.io/ascend/vllm-ascend:latest
    container_name: qwen3-embedding-0.6b
    restart: unless-stopped
    shm_size: 1g
    ipc: host
    privileged: true
    stdin_open: true
    tty: true
    devices:
      - /dev/davinci2
      - /dev/davinci_manager
      - /dev/devmm_svm
      - /dev/hisi_hdc
    ports:
      - "8000:8000"
    volumes:
      - /usr/local/dcmi:/usr/local/dcmi
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi
      - /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/
      - /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info
      - /etc/ascend_install.info:/etc/ascend_install.info
      - /root/.cache:/root/.cache
    environment:
      - VLLM_USE_MODELSCOPE=True
      - PYTORCH_NPU_ALLOC_CONF=max_split_size_mb:256
      - HF_ENDPOINT=https://www.hf-mirror.com
    command: >
      bash -lc "vllm serve Qwen/Qwen3-Embedding-0.6B --task embed --host 0.0.0.0 --port 8000 --gpu-memory-utilization 0.45 --max-model-len 4096 --enforce-eager"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

# docker compose -f docker-compose.qwen3.yaml up -d qwen3-embedding    

  qwen3-reranker:
    image: quay.io/ascend/vllm-ascend:latest
    container_name: qwen3-reranker-0.6b
    restart: unless-stopped
    shm_size: 1g
    ipc: host
    privileged: true
    stdin_open: true
    tty: true
    devices:
      - /dev/davinci2
      - /dev/davinci_manager
      - /dev/devmm_svm
      - /dev/hisi_hdc
    ports:
      - "8001:8000"
    volumes:
      - /usr/local/dcmi:/usr/local/dcmi
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi
      - /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/
      - /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info
      - /etc/ascend_install.info:/etc/ascend_install.info
      - /root/.cache:/root/.cache
    environment:
      - VLLM_USE_MODELSCOPE=True
      - PYTORCH_NPU_ALLOC_CONF=max_split_size_mb:256
      - HF_ENDPOINT=https://www.hf-mirror.com
    command: >
      bash -lc "vllm serve Qwen/Qwen3-Reranker-0.6B --host 0.0.0.0 --port 8000 --gpu-memory-utilization 0.35 --max-model-len 4096 --enforce-eager"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
      
